# 원본(GitLab archimin/pumsem)을 매주 확인해서, 바뀌었으면 '검토용 Pull Request'를 만든다.
# main 에 직접 넣지 않으므로, 사람이 변경 내역을 보고 Merge 해야 적산도우미에 반영된다.
#
# 처음 한 번 저장소 설정이 필요하다:
#   Settings → Actions → General → Workflow permissions
#     - "Read and write permissions" 선택
#     - "Allow GitHub Actions to create and approve pull requests" 체크
name: 원본(GitLab) 동기화

on:
  schedule:
    - cron: "17 1 * * 1"        # 매주 월요일 10:17 (한국 시간)
  workflow_dispatch:             # Actions 화면에서 'Run workflow' 로 바로 실행

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pumsem-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 원본 받아 비교
        id: sync
        env:
          PUMSEM_SOURCE_TOKEN: ${{ secrets.PUMSEM_SOURCE_TOKEN }}   # 원본이 비공개로 바뀐 경우에만 등록
        run: python tools/sync_from_gitlab.py

      - name: 검토용 Pull Request 만들기
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.sync.outputs.version }}
        run: |
          BRANCH="sync/pumsem-${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/pyojunpumsem.json manifest.json
          git commit -m "표준품셈 자료 갱신 (${VERSION}, 원본 GitLab 동기화)"
          git push --force origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file sync_report.md
          else
            gh pr create --base main --head "$BRANCH" \
              --title "표준품셈 자료 갱신 (${VERSION})" --body-file sync_report.md
          fi
